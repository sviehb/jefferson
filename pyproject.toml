#:schema https://json.schemastore.org/pyproject.json

[project]
authors = [
  { name = "ONEKEY", email = "support@onekey.com" },
  { name = "Stefan Viehböck", email = "support@onekey.com" },
]
dependencies = [
  "click>=8.1.3,<9",
  "dissect-cstruct>=4.4,<5",
  "lzallright>=0.3,<0.4",
]
description = "JFFS2 filesystem extraction tool."
license = "MIT"
license-files = ["LICENSE"]
name = "jefferson"
readme = "README.md"
requires-python = ">=3.11"
version = "0.4.8"

[project.scripts]
jefferson = "jefferson.cli:main"

[dependency-groups]
check = [
  "pre-commit>=3.5,<5.0",
  "ruff==0.16.10",
  "taplo>=0.9.3",
]
dev = [
  { include-group = "check" },
  { include-group = "test" },
  { include-group = "type" },
]
test = ["pytest-cov>=7,<8", "pytest>=8.0.0"]
type = ["pyright>=1.1.349"]

[tool.uv.build-backend]
module-root = ""

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.12.17,<0.13"]

[tool.pytest.ini_options]
addopts = "--cov"
norecursedirs = """
  *.egg
  *_extract
  .*
  dist
  build
  target
"""

[tool.coverage.run]
branch = true
patch = ["subprocess"]          # CLI tests run `python -m jefferson.cli` in a subprocess
source = ["jefferson", "tests"]

[tool.coverage.report]
fail_under = 50
skip_covered = true

[tool.vulture]
exclude = []
paths = ["jefferson/", "vulture_whitelist.py"]

[tool.pyright]
exclude = [".venv", "build", "vulture_whitelist.py"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = [
  "A",      # flake8-builtins
  "ARG",    # flake8-unused-arguments
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "C90",    # mccabe
  "COM818", # flake8-commas; trailing-comma-on-bare-tuple
  "D",      # pydocstyle
  "E",      # pycodestyle (errors)
  "F",      # pyflakes
  "FBT",    # flake8-boolean-trap
  "G",      # flake8-logging-format
  "I",      # isort
  "N",      # pep8-naming
  "PIE",    # flake8-pie
  "PL",     # pylint
  "PT",     # flake8-pytest-style
  "PTH",    # flake8-use-pathlib
  "RET",    # flake8-return
  "RSE",    # flake8-raise
  "RUF",    # ruff's own lints
  "S",      # flake8-bandit
  "SIM",    # flake8-simplify
  "SLF",    # flake8-self
  "T10",    # flake8-debugger
  "T20",    # flake8-print
  "TC",     # flake8-type-checking
  "TRY",    # tryceratops
  "UP",     # pyupgrade
  "W",      # pycodestyle (warnings)
]

ignore = [
  "D1",    # undocumented-*:                          We are not documenting every public symbol
  "D203",  # one-blank-line-before-class:             D211 (no-blank-line-before-class) is used instead
  "D213",  # multi-line-summary-second-line:          D212 (multi-line-summary-first-line) is used instead
  "E501",  # line-too-long:                           Let ruff format handle line length violations
  "PLR09", # too-many-{arguments,branches,...}:       We do not want to impose hard limits
  "S101",  # assert:                                  Enable usage of asserts
  "S603",  # subprocess-without-shell-equals-true:    This check just highlights, that we should check for untrusted inputs
  "T201",  # print:                                   Extraction progress is reported on stdout
]

[tool.ruff.lint.per-file-ignores]
"jefferson/jffs2.py" = [
  "PTH", # Needs a followup refactor
]
"tests/*" = [
  "FBT001", # boolean-positional-arg-in-function-definition: allowed in `pytest.param()`
  "FBT003", # boolean-positional-value-in-function-call:     allowed test parameters
]

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true # code like `dict(a=1, b=2)` is allowed

[tool.ruff.lint.isort]
known-first-party = ["jefferson"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
allow-magic-value-types = [
  "bytes",
  "int",   # bunch of ad-hoc bitmask values
  "str",
]
